services:
  - type: web
    name: salo-vapeshop-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_USERNAME
        value: salo
      - key: ADMIN_PASSWORD
        value: 3usebio07
      - key: JWT_SECRET_KEY
        value: salo-vapeshop-jwt-secret-2026
